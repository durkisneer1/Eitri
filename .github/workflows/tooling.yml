name: Python adapters
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      YOWASP_CACHE_DIR: ${{ github.workspace }}/work/yowasp-cache
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest nodejs-wheel-binaries==24.19.0 PySide6-Essentials==6.12.0
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python scripts/prepare_netlistsvg.py
      - name: Build distributable adapter wheels
        run: |
          python -m build --wheel --outdir dist packages/yosys
          python -m build --wheel --outdir dist packages/gtkwave
          python -m build --wheel --outdir dist packages/netlistsvg
      - name: Install built adapters (GHDL tested in native workflow)
        run: python -c "import glob,subprocess,sys; w=glob.glob('dist/*.whl'); subprocess.check_call([sys.executable,'-m','pip','install',*w])"
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
      # Keep build-generated src/eitri.egg-info out of adapter dependency checks.
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: adapters-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
