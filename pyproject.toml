[build-system]
requires = ["setuptools>=77,<81", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "eitri-hdl"
version = "0.1.0"
description = "A VHDL workspace for editing, simulation, and circuit visualization"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "PySide6-Essentials==6.12.0",
  "pyTooling[terminal]~=8.12",
  "pyVHDLModel~=0.33",
  "yowasp-yosys==0.70.0.0.post1259",
  "pyosys==0.70; sys_platform != 'win32' and python_version < '3.15'",
  "nodejs-wheel-binaries==24.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "setuptools>=77,<81"]

[project.scripts]
ghdl = "ghdl.__main__:main"
ghdl-ls = "pyGHDL.cli.lsp:main"
ghdl-dom = "pyGHDL.cli.dom:main"

[project.gui-scripts]
eitri = "eitri.ui.window:main"

[project.urls]
Homepage = "https://github.com/durkisneer1/Eitri"
Issues = "https://github.com/durkisneer1/Eitri/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs installed tool backends"]

[tool.setuptools.package-data]
eitri = ["assets/*.svg"]

yosys = ["py.typed"]
gtkwave = ["py.typed"]
netlistsvg = ["py.typed", "_vendor/**/*"]
