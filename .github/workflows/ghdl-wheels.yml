name: GHDL native wheels

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: Publish the tested wheels to TestPyPI
        type: boolean
        default: false

defaults:
  run:
    working-directory: packages/ghdl

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest -q

  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pefile
      - run: python scripts/fetch_source.py
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-ada
            mingw-w64-ucrt-x86_64-zlib
      - name: Build native mcode backend
        shell: msys2 {0}
        run: |
          BACKEND=mcode bash scripts/build-native.sh
          pacman -Q > work/toolchain-packages.txt
      - run: python scripts/stage.py
      - name: Bundle recursive DLL dependencies
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          python scripts/bundle_windows.py "$env:MSYS2_LOCATION/ucrt64"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item work/toolchain-packages.txt src/ghdl/_native/
      - run: python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x64
          path: packages/ghdl/dist/*.whl
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - run: python -m pip install build delocate
      - run: brew install llvm@22 zstd
      - run: bash scripts/install_macos_gnat.sh
      - run: python scripts/fetch_source.py
      - name: Build LLVM-JIT backend
        shell: bash
        run: |
          export LLVM_CONFIG="$(brew --prefix llvm@22)/bin/llvm-config"
          BACKEND=llvm-jit bash scripts/build-native.sh
          brew list --versions > work/toolchain-packages.txt
          bash scripts/macos_notices.sh "$($LLVM_CONFIG --version)"
      - run: python scripts/stage.py
      - run: python scripts/prepare_macos.py work/gnat-aarch64-darwin-14.2.0-1
      - run: cp work/toolchain-packages.txt src/ghdl/_native/
      # The Python interpreter is universal2, but the native payload is ARM-only.
      - run: python -m build --wheel -C--build-option=--plat-name=macosx_15_0_arm64
      - name: Relocate native libraries and validate deployment target
        shell: bash
        run: |
          export DYLD_LIBRARY_PATH="$PWD/src/ghdl/_native/lib:$PWD/src/ghdl/_native/bin"
          delocate-wheel --require-archs arm64 -w wheelhouse dist/*.whl
          delocate-listdeps wheelhouse/*.whl > work/dependency-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: packages/ghdl/wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dependency-report
          path: packages/ghdl/work/dependency-report.txt

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gnat gcc g++ make zlib1g-dev
      - run: python -m pip install build auditwheel "patchelf>=0.14.5"
      - run: python scripts/fetch_source.py
      - run: BACKEND=mcode bash scripts/build-native.sh
      - run: python scripts/stage.py
      - name: Preserve toolchain inventory and runtime notices
        run: |
          dpkg-query -W > src/ghdl/_native/toolchain-packages.txt
          mkdir -p src/ghdl/_native/licenses/linux
          for directory in /usr/share/doc/libgnat-* /usr/share/doc/libgcc-s1 /usr/share/doc/libstdc++6 /usr/share/doc/zlib1g; do
            cp "$directory/copyright" "src/ghdl/_native/licenses/linux/$(basename "$directory").txt"
          done
      - run: python -m build --wheel
      - name: Repair and validate manylinux compatibility
        run: |
          auditwheel repair --plat manylinux_2_35_x86_64 -w wheelhouse dist/*.whl
          auditwheel show wheelhouse/*.whl > work/dependency-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x64
          path: packages/ghdl/wheelhouse/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dependency-report
          path: packages/ghdl/work/dependency-report.txt

  clean-install:
    name: Clean install (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: [unit, windows, macos, linux]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14', '3.15']
        target: [windows-x64, macos-arm64, linux-x64]
        include:
          - target: windows-x64
            os: windows-2022
            arch: x64
          - target: macos-arm64
            os: macos-15
            arch: arm64
          - target: linux-x64
            os: ubuntu-22.04
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: packages/ghdl/wheels
      - name: Install exactly one candidate wheel
        run: python -c "import glob,subprocess,sys; w=glob.glob('wheels/*.whl'); assert len(w)==1,w; subprocess.check_call([sys.executable,'-m','pip','install',w[0]])"
      - name: Exercise CLI, simulation, synthesis and direct library with clean PATH
        run: python tests/smoke.py
      - run: python -m pip check
      - name: Build and install the combined Eitri wheel
        working-directory: .
        run: |
          python -m pip install nodejs-wheel-binaries==24.19.0
          python scripts/prepare_netlistsvg.py
          python -m pip install build twine pytest "setuptools>=77,<81"
          python scripts/build_release.py --ghdl-wheel-dir packages/ghdl/wheels --outdir release
          python -m twine check release/*.whl
          python -m pip uninstall -y ghdl-bundled
          python -c "import glob,subprocess,sys; w=glob.glob('release/*.whl'); assert len(w)==1,w; subprocess.check_call([sys.executable,'-m','pip','install',w[0]])"
          python -m pip check
      - name: Verify bundled GHDL after combined installation
        run: python tests/smoke.py
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - name: Test complete workspace imports and tool pipeline
        working-directory: .
        env:
          YOWASP_CACHE_DIR: ${{ github.workspace }}/work/yowasp-cache
        run: python -m pytest -q

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.14'
        with:
          name: eitri-hdl-${{ matrix.target }}
          path: release/*.whl
          if-no-files-found: error

  prepare-release:
    name: Validate release artifacts
    needs: clean-install
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_testpypi)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: eitri-hdl-*
          merge-multiple: true
          path: dist
      - run: python -m pip install twine
      - name: Check package, version, and platform coverage
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import tomllib
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          version = Version(tomllib.loads(Path('pyproject.toml').read_text())['project']['version'])
          tag = os.environ['RELEASE_TAG']
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag} must match project version v{version}')
          wheels = list(Path('dist').iterdir())
          if len(wheels) != 3 or any(p.suffix != '.whl' for p in wheels):
              raise SystemExit('Expected exactly three final Eitri wheels')
          targets = set()
          for wheel in wheels:
              name, wheel_version, _, tags = parse_wheel_filename(wheel.name)
              if name != 'eitri-hdl' or wheel_version != version:
                  raise SystemExit(f'Unexpected package or version: {wheel.name}')
              for t in tags:
                  if (t.interpreter, t.abi) != ('py3', 'none'):
                      raise SystemExit(f'Unexpected Python/ABI tag: {t}')
                  if t.platform == 'win_amd64':
                      targets.add('windows')
                  elif t.platform.startswith('macosx_') and t.platform.endswith('_arm64'):
                      targets.add('macos')
                  elif t.platform.startswith('manylinux_') and t.platform.endswith('_x86_64'):
                      targets.add('linux')
                  else:
                      raise SystemExit(f'Unexpected platform: {t.platform}')
          if targets != {'windows', 'macos', 'linux'}:
              raise SystemExit(f'Incomplete platform coverage: {targets}')
          PY
      - run: python -m twine check --strict dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*.whl
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: prepare-release
    runs-on: ubuntu-22.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/eitri-hdl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare-release, publish-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/eitri-hdl/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
